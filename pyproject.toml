[tool.ruff]

# Select rule sets. "D" enables Django-specific rules, "S" enables security rules.
select = [
    "E",  
    "W",  
    "F",  
    "I",  
    "B",  
    "UP", 
    "D",  
    "S",  
]


ignore = []


line-length = 88


[tool.ruff.lint.flake8-django]
django-settings-module = "newsweb.settings"  


[tool.ruff.format]
quote-style = "preserve"  