

<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <title>Latest News</title>
    <style>
        /* ===== Reset some defaults ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2rem;
            color: #222;
        }

        /* ===== News Container ===== */
        .news-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ===== Single News Card ===== */
        .news-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease-in-out;
        }

        .news-card:hover {
            transform: translateY(-5px);
        }

        .news-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .news-content {
            padding: 15px;
            flex: 1;
        }

        .news-title {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: #0077cc;
        }

        .news-date {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 12px;
        }

        .news-body {
            font-size: 1rem;
            line-height: 1.5;
            color: #444;
        }

        .read-more {
            display: inline-block;
            margin-top: 12px;
            text-decoration: none;
            color: #0077cc;
            font-weight: bold;
        }

        .read-more:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <h1>Latest News</h1>

    <div class="news-container">
        <!-- Loop through News model data here -->
        {% for n in reminder %}
        <div class="news-card">
           
            <div class="news-content">
               
                <p class="news-date">{{ n }}</p>
                <p class="news-body">
                    
                </p>
                <a href=" " class="read-more">Read More →</a>
            </div>
        </div>
        {% endfor %}
    </div>

</body>
</html>
